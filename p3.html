<html lang="en">
<head>
<script>
// ── THEME INIT (runs before paint to avoid flash) ──
(function(){
  const t=localStorage.getItem('ctg-theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ctg.css">
</head>
<body>
<nav class="ctg-nav" id="ctg-nav-bar">
  <a class="ctg-nav-home" href="index.html" data-nav>CTG</a>
  <div class="ctg-nav-links">
    <a href="p1.html" data-nav>I·STATS</a>
    <a href="p2.html" data-nav>II·GEAR</a>
    <a href="p3.html" class="active">III·FAC</a>
    <a href="p4.html" data-nav>IV·ARMS</a>
    <a href="p5.html" data-nav>V·SKILL</a>
    <a href="p6.html" data-nav style="color:var(--red);">VI·COMBAT</a>
  </div>
  <div class="nav-char-name" id="nav-name"><span>OPERATIVE //</span> —</div>
  <span class="save-flash" id="save-flash">SAVED ✓</span>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark / light mode">☀ LIGHT</button>
</nav>

<div class="page-wrap" id="page-wrap">
<div class="sheet">
  <div class="sheet-header">
    <div class="head-tag">CALL TO GALLAHAD // OPERATIONAL RECORD</div>
    <div class="sheet-title">CORE <em>FACULTIES</em></div>
    <div class="head-stamp">PAGE III</div>
  </div>

  <div class="active-bar">
    <div class="active-bar-info">
      <div class="active-bar-label">ACTIVE FACULTIES</div>
      <div class="active-rule">1 PER CATEGORY · MAX 2 ACTIVE · SWITCH ONCE PER ENCOUNTER FREE</div>
    </div>
    <div class="active-slots">
      <div class="active-slot empty" id="active-1">— SLOT I —</div>
      <div class="active-slot empty" id="active-2">— SLOT II —</div>
    </div>
  </div>

  <div class="faculty-grid" id="faculty-grid"></div>

  <div class="sheet-footer">
    <div class="suits"><span class="s1">♠&#xFE0E;</span><span class="s2">♣&#xFE0E;</span><span class="s3">♥&#xFE0E;</span><span class="s4">♦&#xFE0E;</span></div>
    CALL TO GALLAHAD · CORE FACULTIES · PAGE III
  </div>
</div>
</div>

<script>
const FACULTIES=[
  {id:'force',name:'Force',icon:'♣',note:'Raw physical output: smashing, grappling, kicking doors in.',tuning:[
    {name:'Large Handed',sub:'Amplifies raw impact',actions:'Smash doors, throw barrels, grapple massive Marionettes, break objects to create environmental advantages.',strikethrough:true},
    {name:'Rusty Anchor',sub:'Rooted power',actions:'Hold your ground against tides, resist pushes, brace for heavy attacks.'},
    {name:'Bull Wit Da Horn',sub:'Dynamic motion',actions:'Sprint into action, slam through obstacles, chase fleeing threats.'}]},
  {id:'finess',name:'Finesse',icon:'≫',note:'Control and precision: lockpicking, surgery, shooting, sleight-of-hand.',tuning:[
    {name:'Long Fingernails',sub:'Extreme precision',actions:'Thread small mechanisms, pick locks, operate delicate machinery, snipe Marionettes\' weak points.'},
    {name:"Shadow's Shadow",sub:'Stealth & subtlety',actions:'Move quietly, slip past guards, shadow objects, avoid notice.'},
    {name:'Glover',sub:'Speed & timing',actions:'Multi-action precision, manipulate multiple devices or objects, perform sequences.',strikethrough:true}]},
  {id:'sense',name:'Sense',icon:'◉',note:'Perception and awareness: tracking, spotting danger, reading body language.',tuning:[
    {name:'Starved Hound',sub:'Follow and predict',actions:'Identify hidden Marionettes, trace unusual movements, follow scent or mechanical traces.',strikethrough:true},
    {name:'Hawk-Eagles Eyes',sub:'Awareness in action',actions:'Spot ambushes, identify danger before it strikes, read room layout quickly.',strikethrough:true},
    {name:'Large Drums',sub:'Hear subtle signals',actions:'Listen to distant sounds, detect machinery cues, anticipate enemy intentions.',strikethrough:true}]},
  {id:'logic',name:'Logic',icon:'◆',note:'Processing and problem solving: repairing, decoding, planning, strategy.',tuning:[
    {name:'A Smart Thief?',sub:'Structural insight',actions:'See weaknesses in structures, plan environmental solutions, reroute machinery.',strikethrough:true},
    {name:'Plague Surgeon',sub:'Surgical clarity',actions:'Repair engines, disable Marionette mechanisms, solve delicate problems.'},
    {name:'Folder Mind',sub:'Pattern recognition',actions:'Observe sequences, predict Marionette routines, find weaknesses in plans.'}]},
  {id:'velvet',name:'Velvet',icon:'♥',note:'Social gravity: intimidation, leadership, charm, lying.',tuning:[
    {name:'Silver and Steel',sub:'Grin & persuasion',actions:'Convince others, defuse tension, rally allies, manipulate Marionettes emotionally.',strikethrough:true},
    {name:'Bronze and Woah',sub:'Intimidation & dominance',actions:'Force compliance, scare off Marionettes or rivals, establish authority.'},
    {name:'Turned Around Mirror',sub:'Adaptive social tactics',actions:'Reflect moods, mirror speech or gesture to manipulate outcomes.'}]},
  {id:'endure',name:'Endure',icon:'♠',note:'Pain tolerance and resilience: surviving poison, holding breath, resisting panic.',tuning:[
    {name:'Steel Jaw, Low Brim',sub:'Calm under duress',actions:'Resist panic, ignore distractions, remain composed during chaos.',strikethrough:true},
    {name:'Cutting Board',sub:'Toughness & recovery',actions:'Shake off damage, survive hazardous conditions, resist toxins.'},
    {name:'Tongue-less',sub:'Extreme tolerance',actions:'Consume the worst of the worst, perform impossible feats of endurance. Drink seawater.'}]},
];
const state={selected:{},active:[null,null]};
(function(){const s=load('ctg-faculties');if(s){const d=JSON.parse(s);state.selected=d.selected||{};state.active=d.active||[null,null];}})();
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
let flashT;function flashSaved(){const f=document.getElementById('save-flash');f.classList.add('show');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('show'),1200);}
function persist(){try{localStorage.setItem('ctg-faculties',JSON.stringify(state));localStorage.setItem('ctg-last-edit',Date.now());flashSaved();}catch(e){}}

function updateActiveBar(){
  ['active-1','active-2'].forEach((id,i)=>{
    const el=document.getElementById(id);const fid=state.active[i];
    if(fid){const f=FACULTIES.find(x=>x.id===fid);const t=state.selected[fid];const tn=(t!=null)?f.tuning[t].name:'(none)';el.textContent=`${f.icon} ${f.name} · ${tn}`;el.classList.remove('empty');}
    else{el.textContent=`— SLOT ${['I','II'][i]} —`;el.classList.add('empty');}
  });
}
function build(){
  const grid=document.getElementById('faculty-grid');grid.innerHTML='';
  FACULTIES.forEach(fac=>{
    const isActive=state.active.includes(fac.id);const sel=state.selected[fac.id];
    const card=document.createElement('div');card.className='faculty-card'+(isActive?' active-card':'');
    card.innerHTML=`
      <div class="faculty-header"><span class="faculty-icon">${fac.icon}</span><span class="faculty-name">${fac.name}</span>
        <button class="fac-active-btn${isActive?' is-active':''}" onclick="toggleActive('${fac.id}')"><span class="fac-tick-box">${isActive?'✓':''}</span>${isActive?'ACTIVE':'ACTIVATE'}</button>
      </div>
      <div class="faculty-note">${fac.note}</div>
      <div class="tuning-list">
        ${fac.tuning.map((t,i)=>`<div class="tuning-entry ${sel===i?'selected':''}${sel===i&&isActive?' active-sel':''}" onclick="selectTuning('${fac.id}',${i})"><div class="tuning-name">${t.name}${t.sub?`<span class="tuning-sub"> — ${t.sub}</span>`:''}</div><div class="tuning-actions"><strong>Actions:</strong> ${t.actions}</div></div>`).join('')}
      </div>`;
    grid.appendChild(card);
  });
}
function selectTuning(fid,ti){
  if(state.selected[fid]===ti)state.selected[fid]=null;
  else state.selected[fid]=ti;
  persist();build();updateActiveBar();
}
function toggleActive(fid){
  const idx=state.active.indexOf(fid);
  if(idx!==-1)state.active[idx]=null;
  else{const e=state.active.indexOf(null);if(e!==-1)state.active[e]=fid;else{state.active[0]=state.active[1];state.active[1]=fid;}}
  persist();build();updateActiveBar();
}
(function(){const n=load('ctg-f-name');const c=load('ctg-f-code');document.getElementById('nav-name').innerHTML='<span>OPERATIVE //</span> '+((n||'')+(c?' "'+c+'"':'')||'—');})();
document.querySelectorAll('[data-nav]').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const h=a.getAttribute('href');document.getElementById('page-wrap').classList.add('exit');setTimeout(()=>location.href=h,180);});});
build();updateActiveBar();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ctg-sync.js"></script>
<script src="ctg-theme.js"></script>
</body>
</html>
