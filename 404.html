<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){const t=localStorage.getItem('ctg-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0d">
<title>CTG — 404</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ctg.css">
<style>
body.err-body{
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.err-stage{
  position:relative;
  text-align:center;
  max-width:480px;
  width:calc(100% - 40px);
  padding:52px 40px 44px;
  background:var(--paper);
  border:3px solid var(--ink);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  filter:drop-shadow(7px 7px 0 var(--purple));
  animation:errIn .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes errIn{0%{opacity:0;transform:scale(1.06) rotate(-4deg);}100%{opacity:1;transform:scale(1) rotate(-0.5deg);}}
.err-stamp{
  font-family:'Share Tech Mono',monospace;
  font-size:0.52rem;letter-spacing:5px;
  color:var(--purple);
  margin-bottom:16px;
}
.err-num{
  font-family:'Anton',sans-serif;
  font-style:italic;
  font-size:8rem;
  line-height:0.9;
  color:var(--ink);
  letter-spacing:6px;
  text-shadow:6px 6px 0 var(--purple);
  margin-bottom:14px;
  display:block;
}
.err-bar{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.15rem;
  letter-spacing:4px;
  padding:5px 26px;
  transform:skewX(-10deg) rotate(-1deg);
  box-shadow:4px 4px 0 var(--purple);
  margin-bottom:22px;
}
.err-bar span{transform:skewX(10deg);display:inline-block;}
.err-suits{
  font-size:1.2rem;
  letter-spacing:8px;
  margin:16px 0 20px;
}
.err-body-text{
  font-family:'Rajdhani',sans-serif;
  font-weight:500;
  font-size:0.95rem;
  color:var(--text2);
  line-height:1.7;
  margin-bottom:28px;
}
.err-return{
  display:inline-block;
  background:var(--purple);
  border:2px solid var(--ink);
  color:#fff;
  font-family:'Bebas Neue',sans-serif;
  font-size:0.92rem;
  letter-spacing:2px;
  padding:10px 28px;
  text-decoration:none;
  transform:skewX(-9deg);
  box-shadow:4px 4px 0 var(--ink);
  transition:all .15s;
}
.err-return span{transform:skewX(9deg);display:inline-block;}
.err-return:hover{background:var(--ink);box-shadow:2px 2px 0 var(--purple);}
.err-foot{
  margin-top:26px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.48rem;
  letter-spacing:3px;
  color:var(--text-dim);
}
/* dark mode overrides for text-shadow */
[data-theme="dark"] .err-num{color:var(--ink);text-shadow:6px 6px 0 var(--purple);}
</style>
</head>
<body class="hub-body err-body">

<div class="err-stage">
  <div class="err-stamp">// OPERATIVE ERROR · SIGNAL LOST</div>
  <span class="err-num">404</span>
  <div class="err-bar"><span>PAGE NOT FOUND</span></div>
  <div class="err-suits">
    <span class="s1">♠&#xFE0E;</span>
    <span class="s2">♣&#xFE0E;</span>
    <span class="s3">♥&#xFE0E;</span>
    <span class="s4">♦&#xFE0E;</span>
  </div>
  <div class="err-body-text">
    The dossier page you're looking for has been<br>
    redacted, reassigned, or never existed.<br><br>
    Return to base and try again, Operative.
  </div>
  <a class="err-return" href="index.html"><span>← RETURN TO BASE</span></a>
  <div class="err-foot">CALL TO GALLAHAD · CLASSIFIED</div>
</div>

<script src="ctg-theme.js"></script>
</body>
</html>
