    [{id:'tb3',name:'Tavern Brawler III',tier:3,tiers:3,cost:1,req:['tb2'],desc:'Gain Advance Advantage when making Unarmed melee attacks.'},{id:'maim',name:'Maim',cost:3,desc:'Roll a 1d8 instead of a 1d6 when landing a Critical and targeting the head.'},{id:'tacstrike2',name:'Tactical Strikes II',tier:2,tiers:2,cost:1,req:['tacstrike'],desc:'Your Melee Attacks may Ignore 2 EF of the target creature.'}],

    [{id:'ls1',name:'Lock-Smith I',tier:1,tiers:2,cost:1,desc:'Your Tick range increases by 1.'},{id:'sneaky',name:'Sneaky Bullfish',cost:1,desc:'Move a Distance without using a card. Cannot be equipped with Raging Bullfish.'},{id:'mistersmooth',name:'Mister Smooth',cost:1,desc:'Use Finesse as your base for defensive checks — armour is still added on top.'}],
    [{id:'ls2',name:'Lock-Smith II',tier:2,tiers:2,cost:1,req:['ls1'],desc:'Your Tick range increases by 2.'},{id:'slick',name:'Slick',cost:1,desc:'Use 2 cards for Defense checks, but you cannot counter attack.'},{id:'nightkiller',name:'Night Killer',cost:1,desc:'Double Damage when attacking before seen. Targets also cannot scream for help.'}],
    [{id:'bulletcritic',name:'Bullet Critic',cost:2,desc:'Target two separate body parts when landing a Critical.'},{id:'gunbeater',name:'Gun Beater',cost:1,desc:'Automatic-style Ability / Weapon Attacks roll with an Additional Dice.'},{id:'seepin',name:'Seep In',cost:1,desc:'Increase the time your poisons stay active by 1 Round.'}],
    [{id:'tacshots',name:'Tactical Shots',cost:2,desc:'Your Ranged Attacks may Ignore 1 EF of the target creature.'},{id:'letsmove',name:"Let's Move",cost:1,desc:'Move a willing Creature in your zone 1 Distance with you. Requires 2 cards — the dead weight you drag.'},{id:'slippery',name:'Slippery',cost:1,desc:'When moving ranges you may not be targeted by Attacks of Opportunity.'}],
    [{id:'stepout',name:'Step Out',cost:3,desc:'Contest an Area attack or Effect with Finesse. Success: no damage and none of the Negative Effects. Fail: half damage, still Effected.'}]]},
  {id:'endurance',label:'Endurance',icon:'♠',color:'#8aabbb',stat:3,rows:[
    [{id:'td1',name:'Tavern Defender I',tier:1,tiers:3,cost:1,desc:'Gain Advance when making a Blocking Check against an attack.'},{id:'boozehound',name:'Booze Hound',cost:1,desc:'You do not suffer the negative effects of alcohol.'},{id:'stimlegend',name:'Stim Legend',cost:1,desc:'When using a Medical Stim you heal 2 health points.'}],
    [{id:'td2',name:'Tavern Defender II',tier:2,tiers:3,cost:1,req:['td1'],desc:'Gain Advantage when making a Blocking Check against an attack.'},{id:'drunktrain',name:'Drunken Trainer',tier:1,tiers:3,cost:1,req:['boozehound'],desc:'Gain Advance on Melee attacks while under the effects of alcohol.'},{id:'mistakemaker',name:'Mistake Maker',cost:1,desc:'Add a Spades card to Defensive checks against counters without using a Reaction — you cannot counter back.'}],
    [{id:'td3',name:'Tavern Defender III',tier:3,tiers:3,cost:1,req:['td2'],desc:'Gain Advance Advantage when making a Blocking Check against an attack.'},{id:'drunkmaster',name:'Drunken Master',tier:2,tiers:3,cost:1,req:['drunktrain'],desc:'Gain Advantage on Melee attacks while under the effects of alcohol.'},{id:'ivegotyou',name:"I've Got You",cost:1,desc:'Attempt to Block for a creature in Close Range. If the Block fails they still take the damage, and you may not counter.'}],
    [{id:'drunkshifu',name:'Drunken Shifu',tier:3,tiers:3,cost:1,req:['drunkmaster'],desc:'Gain +1 damage and Advance Advantage on Melee attacks while under the effects of alcohol.'},{id:'shrugitoff',name:'Shrug It Off',cost:1,desc:'Reduce a Negative Effect applied on you by 1 Round.'},{id:'stillstanding',name:'Still Standing',cost:1,desc:'Ignore the Prone effect when forced to go Prone. You still stand.'}],
    [{id:'budgeout',name:'Budge Out',cost:2,desc:'Contest an Area attack or Effect with Endurance. Success: no damage and none of the Negative Effects. Fail: half damage, still Effected.'},{id:'juggernaut',name:'Juggernaut',cost:4,desc:'Reduce the damage of a Critical attack by 1d4.'}]]},
  {id:'logic',label:'Logic',icon:'◆',color:'#9d5ff5',stat:3,rows:[
    [{id:'hs1',name:'Hack-Smith I',tier:1,tiers:2,cost:1,desc:'Your Guess count increases by 1.'},{id:'wandsmith',name:'Wandering Smith',cost:1,desc:'Modify your weapon without the need of a workbench.'},{id:'lonescient',name:'Lone Scientist',cost:1,desc:'Research without the need of a workbench.'}],
    [{id:'hs2',name:'Hack-Smith II',tier:2,tiers:2,cost:1,req:['hs1'],desc:'Your Guess count increases by 2.'},{id:'labmade',name:'Lab Made',cost:1,desc:'Immediately gain an Additional 2 Maximum Harth.'},{id:'precshot',name:'Precise Shot',cost:2,desc:"Your gun's Range decreases a Distance."}],
    [{id:'predict',name:'Predictable',cost:2,desc:'Your first attack in combat may be made as a Critical.'},{id:'tacspells',name:'Tactical Spells',cost:2,desc:'Your Magic Attacks may Ignore 1 EF of the target creature.'},{id:'ecowizard',name:'Eco Wizard',cost:1,desc:'Recover Hearth when landing a Critical. (Doc line was cut off — confirm the exact wording.)'}],
    [{id:'critmancer',name:'Crit-Mancer',tier:1,tiers:2,cost:2,desc:'Your Critical dice is increased to a 1d8.'},{id:'specialist',name:'Specialist',cost:2,desc:'Roll a 1d10 when using one of your Specials.'}],
    [{id:'critmancer2',name:'Crit-Mancer II',tier:2,tiers:2,cost:2,req:['critmancer'],desc:'Your Critical dice is increased to a 1d10.'}]]},
  {id:'sense',label:'Sense',icon:'◉',color:'#4a9a4a',stat:2,rows:[
    [{id:'lr1',name:'Long Ranger I',tier:1,tiers:3,cost:1,desc:'Gain Advance when shooting enemies that are Far away.'},{id:'bulletpitch',name:'Bullet Pitcher',cost:1,desc:'Counter ranged Attacks out of your maximum distance.'},{id:'holddat',name:'Hold Dat',cost:1,desc:'Swap a card with a willing player (or the GM) once per Encounter.'}],
    [{id:'lr2',name:'Long Ranger II',tier:2,tiers:3,cost:1,req:['lr1'],desc:'Gain Advantage when shooting enemies that are Far away.'},{id:'inscope',name:'In My Scope',cost:3,desc:'Your Ranged Weapons range increases by 1.'},{id:'teamtarget',name:'Team Target',cost:2,desc:'When you use a heal of any kind, all allies in Close Range gain half of its effect.'}],
    [{id:'lr3',name:'Long Ranger III',tier:3,tiers:3,cost:1,req:['lr2'],desc:'Gain Advance Advantage when shooting enemies that are Far away.'},{id:'prepared',name:'Pre-Pared',cost:2,desc:'Start the first Round of combat with +1 to your total Hand Size.'},{id:'wideawake',name:'Wide Awake',cost:2,desc:'Your first Counter each Round may be made without the need of your Reaction.'}],
    [{id:'allin',name:'All In',cost:3,desc:'Doc line was cut off ("You may use…") — confirm the wording with your GM, then edit it here.'}]]},
  {id:'shine',label:'Shine',icon:'✤',color:'#bb88ee',stat:1,rows:[
    [{id:'hh1',name:'Head Hunter I',tier:1,tiers:4,cost:1,desc:'Crit to the head: never deal less than 2 damage, even on a 1.'},{id:'cheater',name:'Cheater',cost:2,desc:'Land a Critical Attack on a natural 19 or 20.'},{id:'next1',name:'Next I',tier:1,tiers:3,cost:1,desc:'Discard and redraw up to 1 of your cards at the start of a combat draw.'}],
    [{id:'hh2',name:'Head Hunter II',tier:2,tiers:4,cost:1,req:['hh1'],desc:'Crit to the head: never deal less than 3 damage, even on a 1.'},{id:'lettingslide',name:'Letting That Slide',cost:3,desc:'Reroll a natural 1 when rolling with your Main Dice (1d20).'},{id:'next2',name:'Next II',tier:2,tiers:3,cost:1,req:['next1'],desc:'Discard and redraw up to 2 of your cards at the start of a combat draw.'}],
    [{id:'hh3',name:'Head Hunter III',tier:3,tiers:4,cost:1,req:['hh2'],desc:'Crit to the head: never deal less than 4 damage, even on a 1.'},{id:'lettingroll',name:'Letting That Roll',cost:2,desc:'Reroll a natural 1 when rolling with your Secondary Dice (the added card).'},{id:'next3',name:'Next III',tier:3,tiers:3,cost:1,req:['next2'],desc:'Discard and redraw up to 3 of your cards at the start of a combat draw.'}],
    [{id:'hh4',name:'Head Hunter IV',tier:4,tiers:4,cost:1,req:['hh3'],desc:'Crit to the head: always deal the max amount of damage.'},{id:'mulligan',name:'Mulligan',cost:1,req:['next3'],desc:'Discard and redraw up to your max hand size at the start of a combat draw.'}]]},
];
let activeCol=COLS[0].id;
const selected=new Set();
try{const s=localStorage.getItem('ctg-skills');if(s)JSON.parse(s).forEach(id=>selected.add(id));}catch(e){}
// Drop any saved picks the rewritten skill list no longer contains (Goblin King,
// the Looter pair, anything else retired) so they stop counting toward totals.
(function(){const live=new Set(COLS.flatMap(c=>c.rows.flat()).map(s=>s.id));let dirty=false;
  [...selected].forEach(id=>{if(!live.has(id)){selected.delete(id);dirty=true;}});
  if(dirty)try{localStorage.setItem('ctg-skills',JSON.stringify([...selected]));}catch(e){}})();
let flashT;function flashSaved(){const f=document.getElementById('save-flash');f.classList.add('show');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('show'),1200);}
function save(){try{localStorage.setItem('ctg-skills',JSON.stringify([...selected]));localStorage.setItem('ctg-last-edit',Date.now());flashSaved();}catch(e){}}
const sp=s=>Math.floor(s/2);
const colById=id=>COLS.find(c=>c.id===id);
function skillById(id){for(const c of COLS){const s=c.rows.flat().find(x=>x.id===id);if(s)return{skill:s,col:c};}return null;}
function spentIn(cid){return colById(cid).rows.flat().filter(s=>selected.has(s.id)).reduce((a,s)=>a+(s.cost||1),0);}
function reqMet(sk){return !sk.req||sk.req.every(r=>selected.has(r));}
function canAfford(sk,cid){if(selected.has(sk.id))return true;return spentIn(cid)+(sk.cost||1)<=sp(colById(cid).stat);}
function hasDeps(id){return COLS.flatMap(c=>c.rows.flat()).some(s=>s.req&&s.req.includes(id)&&selected.has(s.id));}
function toggle(id){
  const {skill,col}=skillById(id);
  if(selected.has(id)){if(hasDeps(id)){const el=document.getElementById('node-'+id);if(el){el.style.outline='1px solid var(--red)';setTimeout(()=>el.style.outline='',500);}return;}selected.delete(id);}
  else{if(!reqMet(skill)||!canAfford(skill,col.id))return;selected.add(id);}
  save();render();
}
function resetCol(){
  const col=colById(activeCol);
  if(!confirm('Reset all '+col.label+' skills?'))return;
  col.rows.flat().forEach(s=>selected.delete(s.id));save();render();
}
function renderBudget(){
  const strip=document.getElementById('budget-strip');strip.innerHTML='';
  COLS.forEach(col=>{
    const tot=sp(col.stat),spent=spentIn(col.id),over=spent>tot;
    const cell=document.createElement('div');cell.className='budget-cell'+(over?' over':'');cell.style.setProperty('--col',col.color);
    let pips='';for(let i=0;i<Math.max(tot,spent);i++)pips+=`<span class="b-pip ${i<spent?(over?'over':'on'):''}"></span>`;
    cell.innerHTML=`<span class="b-name">${col.icon} ${col.label}</span><div class="b-counts"><span class="b-spent" style="color:${over?'var(--red)':col.color}">${spent}</span><span class="b-sep"> / </span><span class="b-total">${tot}</span></div><div class="b-pips">${pips}</div>`;
    strip.appendChild(cell);
  });
}
function renderSidebar(){
  const sb=document.getElementById('tree-sidebar');sb.innerHTML='';
  COLS.forEach(col=>{
    const tab=document.createElement('div');tab.className='side-tab'+(col.id===activeCol?' active':'');tab.style.setProperty('--col',col.color);
    tab.innerHTML=`<span class="ti">${col.icon}</span>${col.label}<span class="tspent">${spentIn(col.id)}/${sp(col.stat)}</span>`;
    tab.onclick=()=>{activeCol=col.id;render();};
    sb.appendChild(tab);
  });
}
function renderTree(){
  const col=colById(activeCol);
  const nodes=document.getElementById('tree-nodes');const svg=document.getElementById('tree-svg');
  nodes.innerHTML='';svg.innerHTML='';
  col.rows.forEach(row=>{
    const rd=document.createElement('div');rd.className='tree-row';
    row.forEach(skill=>{
      const isSel=selected.has(skill.id),isReq=!reqMet(skill),isLock=!isReq&&!canAfford(skill,col.id)&&!isSel;
      let cls='skill-node';if(isSel)cls+=' node-selected';else if(isReq)cls+=' node-prereq';else if(isLock)cls+=' node-locked';
      let tier='';if(skill.tier&&skill.tiers){tier='<div class="node-tier">';for(let t=1;t<=skill.tiers;t++)tier+=`<span class="node-tier-dot${t<=skill.tier?' on':''}"></span>`;tier+='</div>';}
      const cost=(skill.cost>1)?`<span class="node-cost">${skill.cost}pt</span>`:'';
      const lock=(isReq||isLock)?'<span class="node-lock">⊘</span>':'';
      const n=document.createElement('div');n.className=cls;n.id='node-'+skill.id;n.style.setProperty('--col',col.color);
      n.innerHTML=`<div class="node-body">${lock}${tier}<div class="node-name"><span>${skill.name}</span>${cost}</div><div class="node-desc">${skill.desc}</div><span class="node-check">✓</span></div>`;
      if(!isReq&&!isLock)n.onclick=()=>toggle(skill.id);
      n.addEventListener('mouseenter',e=>showTip(e,skill,col,isReq,isLock));
      n.addEventListener('mousemove',moveTip);n.addEventListener('mouseleave',hideTip);
      rd.appendChild(n);
    });
    nodes.appendChild(rd);
  });
  requestAnimationFrame(()=>drawLines(col,svg,nodes));
}
function drawLines(col,svg,nodes){
  const centers={};col.rows.flat().forEach(s=>{const el=document.getElementById('node-'+s.id);if(!el)return;const r=el.getBoundingClientRect();const pr=nodes.getBoundingClientRect();centers[s.id]={x:r.left-pr.left+r.width/2,top:r.top-pr.top,bot:r.top-pr.top+r.height};});
  const wr=nodes.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);svg.style.height=wr.height+'px';
  col.rows.flat().forEach(s=>{if(!s.req)return;s.req.forEach(rid=>{const c=centers[s.id],p=centers[rid];if(!c||!p)return;const active=selected.has(s.id)&&selected.has(rid);const line=document.createElementNS('http://www.w3.org/2000/svg','path');const mid=(p.bot+c.top)/2;line.setAttribute('d',`M${p.x},${p.bot} C${p.x},${mid} ${c.x},${mid} ${c.x},${c.top}`);line.setAttribute('class','connector'+(active?' active':''));if(active)line.style.setProperty('--col-line',col.color);svg.appendChild(line);});});
}
function renderSummary(){
  const total=[...selected].length;
  const pts=COLS.reduce((a,c)=>a+spentIn(c.id),0);
  document.getElementById('tree-summary').innerHTML=`<strong>${pts}</strong> skill points spent across <strong>${total}</strong> skills`;
}
const TIP=document.getElementById('tip');
function showTip(e,sk,col,isReq,isLock){document.getElementById('tip-name').textContent=sk.name;document.getElementById('tip-desc').textContent=sk.desc;let c=`Cost: ${sk.cost||1}pt`;if(sk.req)c+=' · needs prior tier';if(isReq)c+=' · ⊘ LOCKED';else if(isLock)c+=' · ⊘ no points';document.getElementById('tip-cost').textContent=c;TIP.style.setProperty('--col',col.color);TIP.classList.add('show');moveTip(e);}
function moveTip(e){let x=e.clientX+14,y=e.clientY-10;if(x+240>innerWidth)x=e.clientX-250;if(y+120>innerHeight)y=e.clientY-130;TIP.style.left=x+'px';TIP.style.top=y+'px';}
function hideTip(){TIP.classList.remove('show');}
function render(){renderBudget();renderSidebar();renderTree();renderSummary();}

function loadStatsFromStorage(){
  try{
    const s=localStorage.getItem('ctg-stats');
    if(!s)return;
    const stats=JSON.parse(s);
    COLS.forEach(col=>{
      const want=[col.id,col.label.toLowerCase()];
      const match=stats.find(st=>st.name&&want.includes(st.name.toLowerCase()));
      if(match!=null)col.stat=parseInt(match.score)||0;
    });
  }catch(e){}
}

(function(){const n=localStorage.getItem('ctg-f-name');const c=localStorage.getItem('ctg-f-code');document.getElementById('nav-name').innerHTML='<span>OPERATIVE //</span> '+((n||'')+(c?' "'+c+'"':'')||'—');})();
document.querySelectorAll('[data-nav]').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const h=a.getAttribute('href');document.getElementById('page-wrap').classList.add('exit');setTimeout(()=>location.href=h,180);});});
window.addEventListener('storage',e=>{if(e.key==='ctg-stats'){loadStatsFromStorage();render();}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
loadStatsFromStorage();
render();
</script>
