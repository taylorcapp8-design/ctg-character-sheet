<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050508">
<title>CTG — Skill Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--bg2:#080b0f;--panel:#0a0d0a;
  --purple:#7c3aed;--purple2:#9d5ff5;--purple-dim:#3d1a7a;--purple-glow:rgba(124,58,237,0.2);
  --green:#1a4a1a;--green2:#2d6e2d;--green3:#4a9a4a;--green-glow:rgba(74,154,74,0.15);
  --gold:#c8a020;--text:#c8d4c0;--text-dim:#4a5444;--text-bright:#e8f0e0;--red:#cc2200;
  --border:rgba(124,58,237,0.25);--border2:rgba(124,58,237,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(60,26,122,0.18) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 100% 100%,rgba(26,74,26,0.15) 0%,transparent 55%),repeating-linear-gradient(0deg,transparent,transparent 54px,rgba(124,58,237,0.02) 54px,rgba(124,58,237,0.02) 55px),repeating-linear-gradient(90deg,transparent,transparent 54px,rgba(124,58,237,0.02) 54px,rgba(124,58,237,0.02) 55px);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:50px;}
.ctg-nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:2px solid var(--purple);display:flex;align-items:center;padding:0 18px;height:46px;font-family:'Share Tech Mono',monospace;font-size:0.56rem;letter-spacing:2px;animation:navDrop .25s ease both;}
@keyframes navDrop{from{transform:translateY(-100%);}to{transform:translateY(0);}}
.ctg-nav-home{color:var(--purple2);text-decoration:none;font-family:'Black Han Sans',sans-serif;font-size:1.1rem;letter-spacing:3px;padding-right:18px;margin-right:10px;text-shadow:0 0 12px var(--purple-glow);}
.ctg-nav-links{display:flex;height:100%;}
.ctg-nav a{color:var(--text-dim);text-decoration:none;padding:0 14px;height:100%;display:flex;align-items:center;transition:all .15s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
.ctg-nav a:hover{color:var(--text-bright);background:var(--purple-glow);}
.ctg-nav a.active{color:#fff;background:var(--purple);font-weight:700;}
.nav-char-name{margin-left:auto;color:var(--green3);font-size:0.6rem;letter-spacing:1px;}
.nav-char-name span{color:var(--text-dim);}
.save-flash{margin-left:14px;color:var(--green3);opacity:0;transition:opacity .3s;font-size:0.58rem;}
.save-flash.show{opacity:1;}
.page-wrap{animation:pageIn .3s ease-out both;}
@keyframes pageIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.page-wrap.exit{animation:pageOut .2s ease-in both;}
@keyframes pageOut{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-40px);}}
/* header */
.page-head{padding:24px 28px 16px;position:relative;}
.head-tag{font-family:'Share Tech Mono',monospace;font-size:0.52rem;letter-spacing:5px;color:var(--purple2);margin-bottom:4px;}
.sheet-title{font-family:'Black Han Sans',sans-serif;font-size:2.8rem;color:var(--text-bright);letter-spacing:2px;line-height:0.95;text-shadow:3px 3px 0 var(--purple-dim);}
.sheet-title em{color:var(--purple2);font-style:normal;}
.head-stamp{display:inline-block;margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:0.5rem;letter-spacing:4px;color:var(--green3);border:1px solid var(--green2);padding:2px 10px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
/* budget strip */
.budget-strip{display:flex;margin:0 28px 18px;border:1px solid var(--border);background:var(--bg2);}
.budget-cell{flex:1;padding:9px 10px;border-right:1px solid var(--border);position:relative;}
.budget-cell:last-child{border-right:none;}
.budget-cell.over{background:rgba(204,34,0,0.12);}
.b-name{font-family:'Bebas Neue',sans-serif;font-size:0.78rem;letter-spacing:2px;color:var(--text-dim);display:block;margin-bottom:2px;}
.b-counts{font-family:'Share Tech Mono',monospace;font-size:0.7rem;}
.b-spent{color:var(--col);}.b-total,.b-sep{color:var(--text-dim);}
.b-pips{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;}
.b-pip{width:7px;height:7px;border:1px solid var(--border);transform:rotate(45deg);}
.b-pip.on{background:var(--col);border-color:var(--col);}
.b-pip.over{background:var(--red);border-color:var(--red);}
/* main layout: sidebar + canvas */
.tree-layout{display:grid;grid-template-columns:180px 1fr;gap:0;margin:0 28px;border:1px solid var(--border);min-height:460px;}
.tree-sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:12px 0;}
.side-tab{display:flex;align-items:center;gap:8px;padding:11px 16px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:3px;color:var(--text-dim);cursor:pointer;transition:all .15s;position:relative;border-left:3px solid transparent;}
.side-tab:hover{color:var(--text);background:var(--purple-glow);}
.side-tab.active{color:#fff;background:var(--purple-dim);border-left-color:var(--col);}
.side-tab.active::after{content:'▶';position:absolute;right:12px;color:var(--col);font-size:0.7rem;}
.side-tab .ti{font-size:0.9rem;color:var(--col);}
.side-tab .tspent{margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--text-dim);}
.side-tab.active .tspent{margin-right:16px;}
.tree-canvas{padding:24px 20px;position:relative;overflow-x:auto;}
.tree-canvas-inner{position:relative;min-width:520px;}
.tree-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
.tree-nodes{position:relative;z-index:1;display:flex;flex-direction:column;}
.tree-row{display:flex;justify-content:center;gap:14px;padding:0 0 22px;}
/* node */
.skill-node{width:150px;flex-shrink:0;cursor:pointer;transition:transform .15s;}
.skill-node:hover:not(.node-locked):not(.node-prereq){transform:translateY(-2px);}
.node-body{background:var(--panel);border:1px solid var(--border);padding:9px 10px 8px;position:relative;overflow:hidden;transition:all .2s;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);}
.skill-node.node-selected .node-body{border-color:var(--col);background:var(--purple-glow);box-shadow:0 0 14px var(--purple-glow);animation:nodePulse .4s ease;}
@keyframes nodePulse{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
.skill-node.node-selected .node-body::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--col);}
.skill-node.node-locked .node-body{opacity:0.3;}
.skill-node.node-prereq .node-body{opacity:0.42;}
.node-tier{display:flex;gap:3px;margin-bottom:4px;}
.node-tier-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--border2);}
.node-tier-dot.on{background:var(--col);border-color:var(--col);box-shadow:0 0 4px var(--col);}
.node-name{font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:1px;color:var(--text-bright);line-height:1.2;margin-bottom:3px;display:flex;justify-content:space-between;gap:4px;align-items:flex-start;}
.node-cost{font-family:'Share Tech Mono',monospace;font-size:0.5rem;color:var(--purple2);border:1px solid var(--border2);padding:1px 4px;flex-shrink:0;}
.node-desc{font-family:'Rajdhani',sans-serif;font-size:0.72rem;color:var(--text-dim);line-height:1.3;}
.node-lock{position:absolute;top:6px;right:7px;font-size:0.6rem;color:var(--text-dim);}
.node-check{position:absolute;bottom:5px;right:7px;font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--col);opacity:0;}
.skill-node.node-selected .node-check{opacity:1;}
.connector{stroke:var(--border);stroke-width:1.5;fill:none;stroke-dasharray:4,3;}
.connector.active{stroke:var(--col-line);stroke-dasharray:none;}
/* reset + summary */
.tree-foot{display:flex;align-items:center;justify-content:space-between;margin:14px 28px 0;flex-wrap:wrap;gap:10px;}
.tree-summary{font-family:'Share Tech Mono',monospace;font-size:0.6rem;color:var(--text-dim);letter-spacing:1px;}
.tree-summary strong{color:var(--green3);}
.reset-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:2px;padding:6px 16px;cursor:pointer;transition:all .15s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
.reset-btn:hover{border-color:var(--red);color:var(--red);}
/* tooltip */
.tip{position:fixed;z-index:200;background:#0d0a14;border:1px solid var(--border2);padding:10px 14px;max-width:230px;pointer-events:none;opacity:0;transition:opacity .15s;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
.tip.show{opacity:1;}
.tip-name{font-family:'Bebas Neue',sans-serif;font-size:0.9rem;letter-spacing:1px;color:var(--purple2);margin-bottom:5px;}
.tip-desc{font-family:'Rajdhani',sans-serif;font-size:0.8rem;color:var(--text);line-height:1.4;}
.tip-cost{font-family:'Share Tech Mono',monospace;font-size:0.54rem;color:var(--text-dim);margin-top:5px;}
.page-foot{text-align:center;padding:24px;font-family:'Share Tech Mono',monospace;font-size:0.52rem;letter-spacing:3px;color:var(--text-dim);}
.page-foot .s1{color:#7898aa;}.page-foot .s2{color:var(--green3);}.page-foot .s3{color:var(--red);}.page-foot .s4{color:var(--purple2);}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--purple-dim);}
@media(max-width:680px){
  .tree-layout{grid-template-columns:1fr;}
  .tree-sidebar{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:0;}
  .side-tab{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .side-tab.active{border-left:none;border-bottom-color:var(--col);}
  .side-tab.active::after{display:none;}
  .side-tab .tspent{display:none;}
  .sheet-title{font-size:2rem;}
  .budget-strip{flex-wrap:wrap;}.budget-cell{flex:1 1 33%;}
}
@media print{body{background:#fff;color:#000;}.ctg-nav{display:none!important;}.tree-svg{display:none;}}
</style>
</head>
<body>
<nav class="ctg-nav">
  <a class="ctg-nav-home" href="index.html" data-nav>CTG</a>
  <div class="ctg-nav-links">
    <a href="p1.html" data-nav>I·STATS</a>
    <a href="p2.html" data-nav>II·GEAR</a>
    <a href="p3.html" data-nav>III·FAC</a>
    <a href="p4.html" data-nav>IV·ARMS</a>
    <a href="p5.html" class="active">V·SKILL</a>
  </div>
  <div class="nav-char-name" id="nav-name"><span>OPERATIVE //</span> —</div>
  <span class="save-flash" id="save-flash">SAVED ✓</span>
</nav>

<div class="page-wrap" id="page-wrap">
  <div class="page-head">
    <div class="head-tag">CALL TO GALLAHAD // OPERATIONAL RECORD</div>
    <div class="sheet-title">SKILL <em>TREE</em></div>
    <div class="head-stamp">PAGE V</div>
  </div>

  <div class="budget-strip" id="budget-strip"></div>

  <div class="tree-layout">
    <div class="tree-sidebar" id="tree-sidebar"></div>
    <div class="tree-canvas">
      <div class="tree-canvas-inner">
        <svg class="tree-svg" id="tree-svg"></svg>
        <div class="tree-nodes" id="tree-nodes"></div>
      </div>
    </div>
  </div>

  <div class="tree-foot">
    <div class="tree-summary" id="tree-summary"></div>
    <button class="reset-btn" onclick="resetCol()">⌫ RESET THIS TREE</button>
  </div>

  <div class="page-foot">
    <span class="s1">♠</span> <span class="s2">♣</span> <span class="s3">♥</span> <span class="s4">♦</span><br>
    CALL TO GALLAHAD · SKILL TREE · PAGE V
  </div>
</div>

<div class="tip" id="tip"><div class="tip-name" id="tip-name"></div><div class="tip-desc" id="tip-desc"></div><div class="tip-cost" id="tip-cost"></div></div>

<script>
const COLS=[
  {id:'force',label:'Force',icon:'♣',color:'#cc4444',stat:5,rows:[
    [{id:'tb1',name:'Tavern Brawler I',tier:1,tiers:3,cost:1,desc:'Gain Advance on Unarmed melee attacks.'},{id:'gorey',name:'Gorey',cost:1,desc:'Rip off a limb (weaker targets) on a Critical.'},{id:'1togo',name:'1 to Go',cost:1,desc:'Counter at the same time as being attacked in melee.'}],
    [{id:'tb2',name:'Tavern Brawler II',tier:2,tiers:3,cost:1,req:['tb1'],desc:'Gain Advantage on Unarmed melee attacks.'}],
    [{id:'tb3',name:'Tavern Brawler III',tier:3,tiers:3,cost:1,req:['tb2'],desc:'Gain Advance Advantage on Unarmed melee attacks.'}]]},
  {id:'finess',label:'Finesse',icon:'♦',color:'#5588bb',stat:4,rows:[
    [{id:'ls1',name:'Lock-Smith I',tier:1,tiers:2,cost:1,desc:'Your Tick range increases by 1.'},{id:'sneaky',name:'Sneaky Bullfish',cost:1,desc:'Move a Distance without using a card.'},{id:'mistersmooth',name:'Mister Smooth',cost:1,desc:'Use Finesse as base for defensive checks.'}],
    [{id:'ls2',name:'Lock-Smith II',tier:2,tiers:2,cost:1,req:['ls1'],desc:'Your Tick range increases by 2.'},{id:'slick',name:'Slick',cost:1,desc:'Use 2 cards for Defence but cannot counter.'},{id:'nightkiller',name:'Night Killer',cost:1,desc:'Double Damage attacking before seen.'}],
    [{id:'bulletcritic',name:'Bullet Critic',cost:2,desc:'Target two body parts on a Critical.'},{id:'gunbeater',name:'Gun Beater',cost:1,desc:'Automatic guns roll an Additional Dice.'}]]},
  {id:'endurance',label:'Endurance',icon:'♠',color:'#8aabbb',stat:3,rows:[
    [{id:'td1',name:'Tavern Defender I',tier:1,tiers:3,cost:1,desc:'Gain Advance when defending.'},{id:'boozehound',name:'Booze Hound',cost:1,desc:'No negative effects from alcohol.'},{id:'stimlegend',name:'Stim Legend',cost:1,desc:'Medical Stim heals 2 health points.'}],
    [{id:'td2',name:'Tavern Defender II',tier:2,tiers:3,cost:1,req:['td1'],desc:'Gain Advantage when defending.'},{id:'drunktrain',name:'Drunken Trainer',tier:1,tiers:3,cost:1,req:['boozehound'],desc:'Advance on melee while drunk.'},{id:'mistakemaker',name:'Mistake Maker',cost:1,desc:'Add Spades to Defence vs counters, no Reaction.'}],
    [{id:'td3',name:'Tavern Defender III',tier:3,tiers:3,cost:1,req:['td2'],desc:'Advance Advantage when defending.'},{id:'drunkmaster',name:'Drunken Master',tier:2,tiers:3,cost:1,req:['drunktrain'],desc:'Advantage on melee while drunk.'}],
    [{id:'drunkshifu',name:'Drunken Shifu',tier:3,tiers:3,cost:1,req:['drunkmaster'],desc:'Advanced Advantage on melee while drunk.'}]]},
  {id:'logic',label:'Logic',icon:'◈',color:'#9d5ff5',stat:3,rows:[
    [{id:'goblinkg',name:'Goblin King',cost:1,desc:'Junk rounds become neutral, not negative.'},{id:'hs1',name:'Hack-Smith I',tier:1,tiers:2,cost:1,desc:'Your Guess count increases by 1.'},{id:'wandsmith',name:'Wandering Smith',cost:1,desc:'Modify weapons without a workbench.'}],
    [{id:'lonescient',name:'Lone Scientist',cost:1,desc:'Research without a workbench.'},{id:'hs2',name:'Hack-Smith II',tier:2,tiers:2,cost:1,req:['hs1'],desc:'Your Guess count increases by 2.'},{id:'labmade',name:'Lab Made',cost:2,desc:'Immediately gain Additional 2 Harth.'}]]},
  {id:'sense',label:'Sense',icon:'◉',color:'#4a9a4a',stat:2,rows:[
    [{id:'lr1',name:'Long Ranger I',tier:1,tiers:3,cost:1,desc:'Advance shooting Far enemies.'},{id:'precshot',name:'Precise Shot',cost:2,desc:"Gun's Range decreases a Distance."},{id:'hh1',name:'Head Hunter I',tier:1,tiers:4,cost:1,desc:'Crit to head: min 2 damage even on a 1.'}],
    [{id:'lr2',name:'Long Ranger II',tier:2,tiers:3,cost:1,req:['lr1'],desc:'Advantage shooting Far enemies.'},{id:'predict',name:'Predictable',cost:2,desc:'First attack acts like a Critical.'},{id:'hh2',name:'Head Hunter II',tier:2,tiers:4,cost:1,req:['hh1'],desc:'Crit to head: min 3 damage even on a 1.'}],
    [{id:'lr3',name:'Long Ranger III',tier:3,tiers:3,cost:1,req:['lr2'],desc:'Advanced Advantage shooting Far.'},{id:'bulletpitch',name:'Bullet Pitcher',cost:1,desc:'Counter Ranged out of max distance.'},{id:'hh3',name:'Head Hunter III',tier:3,tiers:4,cost:1,req:['hh2'],desc:'Crit to head: min 4 damage even on a 1.'}],
    [{id:'inscope',name:'In My Scope',cost:3,desc:"Gun's range increases a Distance."},{id:'hh4',name:'Head Hunter IV',tier:4,tiers:4,cost:1,req:['hh3'],desc:'Crit to head: always max damage.'}]]},
  {id:'shine',label:'Shine',icon:'✦',color:'#bb88ee',stat:1,rows:[
    [{id:'fourleaf',name:'Four Leafed Looter',cost:1,desc:'Reroll once on loot — must take new roll.'},{id:'cheater',name:'Cheater',cost:2,desc:'Land a Critical on a natural 19 or 20.'}],
    [{id:'fiveleaf',name:'Five Leafed Looter',cost:1,req:['fourleaf'],desc:'Reroll once on loot — choose either result.'}]]},
];
let activeCol=COLS[0].id;
const selected=new Set();
try{const s=localStorage.getItem('ctg-skills');if(s)JSON.parse(s).forEach(id=>selected.add(id));}catch(e){}
let flashT;function flashSaved(){const f=document.getElementById('save-flash');f.classList.add('show');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('show'),1200);}
function save(){try{localStorage.setItem('ctg-skills',JSON.stringify([...selected]));localStorage.setItem('ctg-last-edit',Date.now());flashSaved();}catch(e){}}
const sp=s=>Math.floor(s/2);
const colById=id=>COLS.find(c=>c.id===id);
function skillById(id){for(const c of COLS){const s=c.rows.flat().find(x=>x.id===id);if(s)return{skill:s,col:c};}return null;}
function spentIn(cid){return colById(cid).rows.flat().filter(s=>selected.has(s.id)).reduce((a,s)=>a+(s.cost||1),0);}
function reqMet(sk){return !sk.req||sk.req.every(r=>selected.has(r));}
function canAfford(sk,cid){if(selected.has(sk.id))return true;return spentIn(cid)+(sk.cost||1)<=sp(colById(cid).stat);}
function hasDeps(id){return COLS.flatMap(c=>c.rows.flat()).some(s=>s.req&&s.req.includes(id)&&selected.has(s.id));}
function toggle(id){
  const {skill,col}=skillById(id);
  if(selected.has(id)){if(hasDeps(id)){const el=document.getElementById('node-'+id);if(el){el.style.outline='1px solid var(--red)';setTimeout(()=>el.style.outline='',500);}return;}selected.delete(id);}
  else{if(!reqMet(skill)||!canAfford(skill,col.id))return;selected.add(id);}
  save();render();
}
function resetCol(){
  const col=colById(activeCol);
  if(!confirm('Reset all '+col.label+' skills?'))return;
  col.rows.flat().forEach(s=>selected.delete(s.id));save();render();
}
function renderBudget(){
  const strip=document.getElementById('budget-strip');strip.innerHTML='';
  COLS.forEach(col=>{
    const tot=sp(col.stat),spent=spentIn(col.id),over=spent>tot;
    const cell=document.createElement('div');cell.className='budget-cell'+(over?' over':'');cell.style.setProperty('--col',col.color);
    let pips='';for(let i=0;i<Math.max(tot,spent);i++)pips+=`<span class="b-pip ${i<spent?(over?'over':'on'):''}"></span>`;
    cell.innerHTML=`<span class="b-name">${col.icon} ${col.label}</span><div class="b-counts"><span class="b-spent" style="color:${over?'var(--red)':col.color}">${spent}</span><span class="b-sep"> / </span><span class="b-total">${tot}</span></div><div class="b-pips">${pips}</div>`;
    strip.appendChild(cell);
  });
}
function renderSidebar(){
  const sb=document.getElementById('tree-sidebar');sb.innerHTML='';
  COLS.forEach(col=>{
    const tab=document.createElement('div');tab.className='side-tab'+(col.id===activeCol?' active':'');tab.style.setProperty('--col',col.color);
    tab.innerHTML=`<span class="ti">${col.icon}</span>${col.label}<span class="tspent">${spentIn(col.id)}/${sp(col.stat)}</span>`;
    tab.onclick=()=>{activeCol=col.id;render();};
    sb.appendChild(tab);
  });
}
function renderTree(){
  const col=colById(activeCol);
  const nodes=document.getElementById('tree-nodes');const svg=document.getElementById('tree-svg');
  nodes.innerHTML='';svg.innerHTML='';
  col.rows.forEach(row=>{
    const rd=document.createElement('div');rd.className='tree-row';
    row.forEach(skill=>{
      const isSel=selected.has(skill.id),isReq=!reqMet(skill),isLock=!isReq&&!canAfford(skill,col.id)&&!isSel;
      let cls='skill-node';if(isSel)cls+=' node-selected';else if(isReq)cls+=' node-prereq';else if(isLock)cls+=' node-locked';
      let tier='';if(skill.tier&&skill.tiers){tier='<div class="node-tier">';for(let t=1;t<=skill.tiers;t++)tier+=`<span class="node-tier-dot${t<=skill.tier?' on':''}"></span>`;tier+='</div>';}
      const cost=(skill.cost>1)?`<span class="node-cost">${skill.cost}pt</span>`:'';
      const lock=(isReq||isLock)?'<span class="node-lock">⊘</span>':'';
      const n=document.createElement('div');n.className=cls;n.id='node-'+skill.id;n.style.setProperty('--col',col.color);
      n.innerHTML=`<div class="node-body">${lock}${tier}<div class="node-name"><span>${skill.name}</span>${cost}</div><div class="node-desc">${skill.desc}</div><span class="node-check">✓</span></div>`;
      if(!isReq&&!isLock)n.onclick=()=>toggle(skill.id);
      n.addEventListener('mouseenter',e=>showTip(e,skill,col,isReq,isLock));
      n.addEventListener('mousemove',moveTip);n.addEventListener('mouseleave',hideTip);
      rd.appendChild(n);
    });
    nodes.appendChild(rd);
  });
  requestAnimationFrame(()=>drawLines(col,svg,nodes));
}
function drawLines(col,svg,nodes){
  const centers={};col.rows.flat().forEach(s=>{const el=document.getElementById('node-'+s.id);if(!el)return;const r=el.getBoundingClientRect();const pr=nodes.getBoundingClientRect();centers[s.id]={x:r.left-pr.left+r.width/2,top:r.top-pr.top,bot:r.top-pr.top+r.height};});
  const wr=nodes.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${wr.width} ${wr.height}`);svg.style.height=wr.height+'px';
  col.rows.flat().forEach(s=>{if(!s.req)return;s.req.forEach(rid=>{const c=centers[s.id],p=centers[rid];if(!c||!p)return;const active=selected.has(s.id)&&selected.has(rid);const line=document.createElementNS('http://www.w3.org/2000/svg','path');const mid=(p.bot+c.top)/2;line.setAttribute('d',`M${p.x},${p.bot} C${p.x},${mid} ${c.x},${mid} ${c.x},${c.top}`);line.setAttribute('class','connector'+(active?' active':''));if(active)line.style.setProperty('--col-line',col.color);svg.appendChild(line);});});
}
function renderSummary(){
  const total=[...selected].length;
  const pts=COLS.reduce((a,c)=>a+spentIn(c.id),0);
  document.getElementById('tree-summary').innerHTML=`<strong>${pts}</strong> skill points spent across <strong>${total}</strong> skills`;
}
const TIP=document.getElementById('tip');
function showTip(e,sk,col,isReq,isLock){document.getElementById('tip-name').textContent=sk.name;document.getElementById('tip-desc').textContent=sk.desc;let c=`Cost: ${sk.cost||1}pt`;if(sk.req)c+=' · needs prior tier';if(isReq)c+=' · ⊘ LOCKED';else if(isLock)c+=' · ⊘ no points';document.getElementById('tip-cost').textContent=c;TIP.style.setProperty('--col',col.color);TIP.classList.add('show');moveTip(e);}
function moveTip(e){let x=e.clientX+14,y=e.clientY-10;if(x+240>innerWidth)x=e.clientX-250;if(y+120>innerHeight)y=e.clientY-130;TIP.style.left=x+'px';TIP.style.top=y+'px';}
function hideTip(){TIP.classList.remove('show');}
function render(){renderBudget();renderSidebar();renderTree();renderSummary();}
(function(){const n=localStorage.getItem('ctg-f-name');const c=localStorage.getItem('ctg-f-code');document.getElementById('nav-name').innerHTML='<span>OPERATIVE //</span> '+((n||'')+(c?' "'+c+'"':'')||'—');})();
document.querySelectorAll('[data-nav]').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const h=a.getAttribute('href');document.getElementById('page-wrap').classList.add('exit');setTimeout(()=>location.href=h,180);});});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
render();
</script>
</body>
</html>
